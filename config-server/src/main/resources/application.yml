spring.application.name: config-server
spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Bavigadda-Prudhviraj/ecommerce-config-server
          username: YOUR_CLIENT_USERNAME_HERE
          password: YOUR_CLIENT_PASSWORD_HERE
          default-label: master


server:
  port: 8888

logging:
  level:
    org.springframework.cloud.config: DEBUG


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka